    <title>Embed host (F-03 test)</title>

      body { font: 15px/1.6 system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; background: #faf8f5; color: #222; }

  <body>
    <h1>My weather station write-up</h1>

      allow="fullscreen; autoplay" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox" title="TryBoard"></iframe>
