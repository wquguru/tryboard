<!doctype html>
<html lang="en" data-i18n="site select">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme is fixed before first paint (same rule as web/src/theme.ts: localStorage tb-theme, else system). -->
    <script>try{var t=localStorage.getItem('tb-theme')}catch(e){}document.documentElement.dataset.theme=t==='dark'||t==='light'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
    <title>Pick a board · TryBoard</title>
    <meta name="description" content="Pick a board for your project: choose what to build and get the chip, dev board, parts list, wiring and power estimate, each marked as verified in simulation or needing a real board." />
    <!-- Share card (DESIGN_V2 §8.5): og.png is rendered by tools/webtest/og.mjs; make og:image absolute once the domain is fixed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TryBoard" />
    <meta property="og:title" content="Pick a board · TryBoard" />
    <meta property="og:description" content="Pick a board for your project: choose what to build and get the chip, dev board, parts list, wiring and power estimate, each marked as verified in simulation or needing a real board." />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Self-hosted fonts (P2-19, generated by tools/fonts/subset.py, OFL-1.1). -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/advisor/main.tsx"></script>
  </body>
</html>
