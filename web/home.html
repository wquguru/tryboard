    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try{var t=localStorage.getItem('tb-theme')}catch(e){}document.documentElement.dataset.theme=t==='dark'||t==='light'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
    <title>Page moved, redirecting… · TryBoard</title>

    <meta property="og:site_name" content="TryBoard" />
    <meta property="og:title" content="TryBoard · Free online lab for AI hardware projects" />

    <meta property="og:image" content="https://tryboard.indaloop.app/og.png" />
    <meta property="og:image:width" content="1200" />

    <script>
      location.replace('./' + location.search + location.hash);

    <noscript><meta http-equiv="refresh" content="0; url=./" /></noscript>
    <style>
      /* DESIGN §2 light / dark values (same as app.css); data-theme is set by the inline script above. */
      :root { --bg: #ffffff; --fg: #1e1e1e; --accent: #0d99ff; color-scheme: light; }
      :root[data-theme='dark'] { --bg: #17181b; --fg: #e8eaed; --accent: #3aa8ff; color-scheme: dark; }
      body { margin: 0; font: 13px/1.5 'TB Sans', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; color: var(--fg); background: var(--bg); display: grid; place-items: center; min-height: 100vh; }
      :lang(ja) body { font-family: 'TB Sans', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
      :lang(ko) body { font-family: 'TB Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
      a { color: var(--accent); }
    </style>
  </head>
