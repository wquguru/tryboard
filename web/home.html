<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 主题在首帧前定好（web/src/theme.ts 同一规则：localStorage tb-theme，否则跟随系统） -->
    <script>try{var t=localStorage.getItem('tb-theme')}catch(e){}document.documentElement.dataset.theme=t==='dark'||t==='light'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
    <title>试板 TryBoard</title>
    <meta name="description" content="买零件之前，先在网页上把它做出来：采购、实验台、组装、成品。在浏览器里运行 ESP32 系列芯片的真实固件。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- 自托管字体（P2-19，tools/fonts/subset.py 生成，OFL-1.1） -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <!-- 页面由 src/home/App.tsx 渲染；作品卡按 src/app/works.ts 的作品定义生成：加作品不用改这里 -->

    <script type="module" src="./src/home/main.tsx"></script>
  </body>
</html>
