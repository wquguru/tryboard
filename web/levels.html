<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 主题在首帧前定好（web/src/theme.ts 同一规则：localStorage tb-theme，否则跟随系统） -->
    <script>try{var t=localStorage.getItem('tb-theme')}catch(e){}document.documentElement.dataset.theme=t==='dark'||t==='light'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
    <title>关卡已并入工作台 · 试板 TryBoard</title>
    <meta name="robots" content="noindex" />
    <!-- 旧关卡页（P0-21 下线）：7 关变成工作台里各作品的检查点。#04 → 桌面气象站检查点 04；#07 / #07-spin → 小黄；#07-lens → 透镜小人 -->
    <script>
      (function () {
        var h = location.hash.slice(1);
        var work = 'weather';
        var cp = /^0[1-6]$/.test(h) ? h : '';
        if (h === '07' || h === '07-spin') (work = 'spin'), (cp = '07-spin');
        if (h === '07-lens') (work = 'lens'), (cp = '07-lens');
        location.replace('./app.html?work=' + work + (cp ? '&cp=' + cp : '') + '#bench');
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=./app.html?work=weather#bench" /></noscript>
  </head>
  <body>
    <!-- 上面的脚本已经在跳转；这里只渲染一行提示（src/levels/App.tsx） -->
    <div id="root"></div>
    <script type="module" src="./src/levels/main.tsx"></script>
  </body>
</html>
