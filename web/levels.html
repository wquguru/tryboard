<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关卡已并入工作台 · 试板 TryBoard</title>
    <meta name="robots" content="noindex" />
    <!-- 旧关卡页（P0-21 下线）：7 关变成工作台里各作品的检查点。#04 → 桌面气象站检查点 04；#07 / #07-spin → 小黄；#07-lens → 透镜小人 -->
    <script>
      (function () {
        var h = location.hash.slice(1);
        var work = 'weather';
        var cp = /^0[1-6]$/.test(h) ? h : '';
        if (h === '07' || h === '07-spin') (work = 'spin'), (cp = '07-spin');
        if (h === '07-lens') (work = 'lens'), (cp = '07-lens');
        location.replace('./app.html?work=' + work + (cp ? '&cp=' + cp : '') + '#bench');
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=./app.html?work=weather#bench" /></noscript>
    <style>
      body { margin: 0; font: 13px/1.5 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1e1e1e; background: #fff; display: grid; place-items: center; min-height: 100vh; }
      a { color: #0d99ff; }
    </style>
  </head>
  <body>
    <p>关卡已并入工作台的检查点。正在跳转到 <a href="./app.html?work=weather#bench">实验台</a>…</p>
  </body>
</html>
