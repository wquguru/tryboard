<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try{var t=localStorage.getItem('tb-theme')}catch(e){}document.documentElement.dataset.theme=t==='dark'||t==='light'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
    <title>页面已移动，正在跳转… · 试板 TryBoard</title>
    <!-- 分享卡片（DESIGN_V2 §8.5）：og.png 构建时由 tools/webtest/og.mjs 渲染；上线定域名后 og:image 改绝对地址 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="试板 TryBoard" />
    <meta property="og:title" content="试板 TryBoard · 完全免费的线上 AI 智能硬件实验台" />
    <meta property="og:description" content="试板是完全免费的线上 AI 智能硬件实验台：选零件、运行真实固件、装进外壳、预览成品。" />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- 旧关卡页（P0-21 下线）：7 关变成工作台里各作品的检查点。#04 → 桌面气象站检查点 04；#07 / #07-spin → 小黄；#07-lens → 透镜小人 -->
    <script>
      (function () {
        var h = location.hash.slice(1);
        var work = 'weather';
        var cp = /^0[1-6]$/.test(h) ? h : '';
        if (h === '07' || h === '07-spin') (work = 'spin'), (cp = '07-spin');
        if (h === '07-lens') (work = 'lens'), (cp = '07-lens');
        location.replace('./app?work=' + work + (cp ? '&cp=' + cp : '') + '#bench');
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=./app?work=weather#bench" /></noscript>
    <style>
      /* DESIGN §2 亮 / 暗两套（与 app.css 同值）；data-theme 由上面的内联脚本设 */
      :root { --bg: #ffffff; --fg: #1e1e1e; --accent: #0d99ff; color-scheme: light; }
      :root[data-theme='dark'] { --bg: #17181b; --fg: #e8eaed; --accent: #3aa8ff; color-scheme: dark; }
      body { margin: 0; font: 13px/1.5 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--fg); background: var(--bg); display: grid; place-items: center; min-height: 100vh; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <p>页面已移动，正在跳转到 <a href="./app?work=weather#bench">实验台</a>…</p>
  </body>
</html>
