<!doctype html>
<html lang="en" data-i18n="site">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme is fixed before first paint (same rule as web/src/theme.ts: localStorage tb-theme, else system). -->
    <script>try{var t=localStorage.getItem('tb-theme')}catch(e){}document.documentElement.dataset.theme=t==='dark'||t==='light'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
    <!-- Home is / (DESIGN_V2 §7.2). Old lab links index.html?example=X jump to the lab sample before home content flashes. -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var ex = q.get('example');
        if (ex) location.replace('./app?work=blank&example=' + encodeURIComponent(ex) + (q.get('debug') === '1' ? '&debug=1' : '') + '#bench');
      })();
    </script>
    <title>TryBoard · Free online lab for AI hardware projects</title>
    <meta name="description" content="TryBoard is a free online lab for AI hardware: pick parts, run real firmware, fit it in a case and preview the finished product." />
    <!-- Share card (DESIGN_V2 §8.5): og.png is rendered by tools/webtest/og.mjs; og:image is absolute on the site domain (DECISIONS 2026-10-22) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TryBoard" />
    <meta property="og:title" content="TryBoard · Free online lab for AI hardware projects" />
    <meta property="og:description" content="TryBoard is a free online lab for AI hardware: pick parts, run real firmware, fit it in a case and preview the finished product." />
    <meta property="og:image" content="https://tryboard.indaloop.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Self-hosted fonts (P2-19, generated by tools/fonts/subset.py, OFL-1.1). -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <!-- Rendered by src/home/App.tsx; cards come from src/app/works.ts, so adding a work needs no change here. -->
    <div id="root"></div>
    <script type="module" src="./src/home/main.tsx"></script>
  </body>
</html>
