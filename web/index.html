<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 主题在首帧前定好（web/src/theme.ts 同一规则：localStorage tb-theme，否则跟随系统） -->
    <script>try{var t=localStorage.getItem('tb-theme')}catch(e){}document.documentElement.dataset.theme=t==='dark'||t==='light'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
    <!-- 首页就是 /（DESIGN_V2 §7.2）。旧实验台链接 index.html?example=X 仍跳到工作台示例（U-07），首页内容不先闪一下 -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var ex = q.get('example');
        if (ex) location.replace('./app?work=blank&example=' + encodeURIComponent(ex) + (q.get('debug') === '1' ? '&debug=1' : '') + '#bench');
      })();
    </script>
    <title>试板 TryBoard · 完全免费的线上 AI 智能硬件实验台</title>
    <meta name="description" content="试板是完全免费的线上 AI 智能硬件实验台：选零件、运行真实固件、装进外壳、预览成品。" />
    <!-- 分享卡片（DESIGN_V2 §8.5）：og.png 构建时由 tools/webtest/og.mjs 渲染；上线定域名后 og:image 改绝对地址 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="试板 TryBoard" />
    <meta property="og:title" content="试板 TryBoard · 完全免费的线上 AI 智能硬件实验台" />
    <meta property="og:description" content="试板是完全免费的线上 AI 智能硬件实验台：选零件、运行真实固件、装进外壳、预览成品。" />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- 自托管字体（P2-19，tools/fonts/subset.py 生成，OFL-1.1） -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <!-- 页面由 src/home/App.tsx 渲染；作品卡按 src/app/works.ts 的作品定义生成：加作品不用改这里 -->
    <div id="root"></div>
    <script type="module" src="./src/home/main.tsx"></script>
  </body>
</html>
