<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工作台 · 试板 TryBoard</title>
    <meta name="description" content="试板工作台：采购、实验台、组装、成品四步，在浏览器里跑真实的 ESP32 固件。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%222%22 width=%2212%22 height=%2212%22 rx=%222%22 fill=%22%230D99FF%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="./src/app/app.css" />
  </head>
  <body class="app" data-step="bench">
    <section id="stage" class="stage" aria-label="3D 台面"></section>
    <div id="stepLayer" class="step-layer"></div>
    <div class="disclaimer">外观示意，非乐鑫官方模型</div>

    <aside class="pnl left" aria-label="构建树">
      <header class="left-head">
        <div class="brand-row"><a class="brand" href="./home.html"><b>试板</b><span class="mono">TRYBOARD</span></a><span id="workName" class="work"></span></div>
        <nav id="steps" class="steps" role="tablist" aria-label="四个步骤"></nav>
      </header>
      <div id="tree" class="tree"></div>
      <details class="serial" open>
        <summary><span>串口</span><span class="mono muted">UART0 · 115200</span></summary>
        <pre id="console" class="mono"></pre>
      </details>
    </aside>

    <div class="cmdk"><input id="cmdk" type="search" placeholder="搜零件、引脚、命令" aria-label="命令框" autocomplete="off" /><kbd class="mono">⌘K</kbd></div>

    <div class="topright">
      <button id="verdict" type="button" class="verdict" data-state="idle">检查点 0/0</button>
      <button id="next" type="button" class="next" disabled>下一步</button>
      <div class="viewcube" role="group" aria-label="视角">
        <button type="button" title="透视">3D</button><button type="button" title="俯视">顶</button><button type="button" title="正视">前</button>
      </div>
    </div>

    <aside id="props" class="pnl right" aria-label="属性面板" aria-live="polite"></aside>

    <div id="toolbar" class="pnl toolbar"></div>

    <footer class="timeline-bar"><div id="timeline"></div><span id="simtime" class="mono simtime">0.00 s</span></footer>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
