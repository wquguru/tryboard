<!doctype html>
<html lang="en" data-i18n="site select app">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme is fixed before first paint (same rule as web/src/theme.ts: localStorage tb-theme, else system). -->
    <script>try{var t=localStorage.getItem('tb-theme')}catch(e){}document.documentElement.dataset.theme=t==='dark'||t==='light'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
    <title>Lab · TryBoard</title>
    <meta name="description" content="TryBoard: shop, lab, assemble, product. Run real ESP32 firmware in your browser in four steps." />
    <!-- Share card (DESIGN_V2 §8.5): og.png is rendered by tools/webtest/og.mjs; make og:image absolute once the domain is fixed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TryBoard" />
    <meta property="og:title" content="Lab · TryBoard" />
    <meta property="og:description" content="TryBoard: shop, lab, assemble, product. Run real ESP32 firmware in your browser in four steps." />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Self-hosted fonts (P2-19, generated by tools/fonts/subset.py, OFL-1.1). -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <!-- Shell is drawn by React (src/app/shell.tsx); main.tsx imports the styles (tailwind.css + views.css + lab.css). -->
  <body class="app overflow-hidden text-[13px] leading-normal max-md:h-auto max-md:overflow-x-hidden max-md:overflow-y-auto" data-step="bench">
    <div id="root"></div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
