<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 主题在首帧前定好（web/src/theme.ts 同一规则：localStorage tb-theme，否则跟随系统） -->
    <script>try{var t=localStorage.getItem('tb-theme')}catch(e){}document.documentElement.dataset.theme=t==='dark'||t==='light'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'</script>
    <title>实验台 · 试板 TryBoard</title>
    <meta name="description" content="试板：采购、实验台、组装、成品四步，在浏览器里跑真实的 ESP32 固件。" />
    <!-- 分享卡片（DESIGN_V2 §8.5）：og.png 构建时由 tools/webtest/og.mjs 渲染；上线定域名后 og:image 改绝对地址 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="试板 TryBoard" />
    <meta property="og:title" content="实验台 · 试板 TryBoard" />
    <meta property="og:description" content="试板：采购、实验台、组装、成品四步，在浏览器里跑真实的 ESP32 固件。" />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- 自托管字体（P2-19，tools/fonts/subset.py 生成，OFL-1.1） -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <!-- 外壳由 React 画（src/app/shell.tsx）；样式由 main.tsx 引入（tailwind.css + views.css + lab.css） -->
  <body class="app overflow-hidden text-[13px] leading-normal max-md:h-auto max-md:overflow-x-hidden max-md:overflow-y-auto" data-step="bench">
    <div id="root"></div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
