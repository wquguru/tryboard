<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设计 A · 项目卡图像化</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 56px 64px; background: #FFFFFF; color: #1E1E1E; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div>
    <div style="font-size: 13px; color: #6F6F6F">1 · 做什么</div>
    <h2 style="margin: 6px 0 0; font-size: 28px">一眼认出项目，而不是读一行字</h2>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
    <button type="button" style="text-align: left; border: 2px solid #0D99FF; background: #F5FAFF; border-radius: 16px; padding: 0; font: inherit; overflow: hidden">
      <div style="height: 150px; background: #E5F4FF; display: flex; align-items: center; justify-content: center">
        <svg width="120" height="96" viewBox="0 0 120 96" fill="none" stroke="#0B76C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="20" width="60" height="40" rx="6"></rect><path d="M24 32h22M24 42h30M24 50h16"></path><path d="M92 18v44"></path><circle cx="92" cy="70" r="9"></circle><path d="M88 30h8M88 40h8"></path><rect x="20" y="70" width="44" height="10" rx="3"></rect></svg>
      </div>
      <div style="padding: 14px 16px 16px"><b style="font-size: 16px">温湿度计</b><div style="font-size: 12px; color: #6F6F6F; margin-top: 4px">BME280 · OLED · 锂电池</div></div>
    </button>
    <button type="button" style="text-align: left; border: 1px solid #E6E6E6; background: #FFFFFF; border-radius: 16px; padding: 0; font: inherit; overflow: hidden">
      <div style="height: 150px; background: #F7F2FF; display: flex; align-items: center; justify-content: center">
        <svg width="120" height="96" viewBox="0 0 120 96" fill="none" stroke="#7A4BC9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 60c14-20 26-20 40 0s26 20 40 0 16-12 20-6"></path><circle cx="20" cy="47" r="4"></circle><circle cx="38" cy="45" r="4"></circle><circle cx="56" cy="62" r="4"></circle><circle cx="74" cy="72" r="4"></circle><circle cx="92" cy="56" r="4"></circle><rect x="46" y="14" width="28" height="16" rx="4"></rect></svg>
      </div>
      <div style="padding: 14px 16px 16px"><b style="font-size: 16px">氛围灯</b><div style="font-size: 12px; color: #6F6F6F; margin-top: 4px">WS2812B · 按键</div></div>
    </button>
    <button type="button" style="text-align: left; border: 1px solid #E6E6E6; background: #FFFFFF; border-radius: 16px; padding: 0; font: inherit; overflow: hidden">
      <div style="height: 150px; background: #FFF6E5; display: flex; align-items: center; justify-content: center">
        <svg width="120" height="96" viewBox="0 0 120 96" fill="none" stroke="#B26A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="16" y="30" width="88" height="40" rx="8"></rect><rect x="26" y="40" width="16" height="16" rx="3"></rect><rect x="46" y="40" width="16" height="16" rx="3"></rect><rect x="66" y="40" width="16" height="16" rx="3"></rect><rect x="86" y="40" width="10" height="16" rx="3"></rect><path d="M60 30V16h18"></path></svg>
      </div>
      <div style="padding: 14px 16px 16px"><b style="font-size: 16px">USB 宏键盘</b><div style="font-size: 12px; color: #6F6F6F; margin-top: 4px">按键 · 原生 USB</div></div>
    </button>
    <button type="button" style="text-align: left; border: 1px solid #E6E6E6; background: #FFFFFF; border-radius: 16px; padding: 0; font: inherit; overflow: hidden">
      <div style="height: 150px; background: #EAF7EF; display: flex; align-items: center; justify-content: center">
        <svg width="120" height="96" viewBox="0 0 120 96" fill="none" stroke="#0E7A41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 50l40-30 40 30"></path><path d="M30 44v32h60V44"></path><rect x="52" y="56" width="16" height="20" rx="2"></rect><circle cx="84" cy="30" r="4"></circle><path d="M78 24a9 9 0 0112 0"></path></svg>
      </div>
      <div style="padding: 14px 16px 16px"><b style="font-size: 16px">智能家居</b><div style="font-size: 12px; color: #6F6F6F; margin-top: 4px">继电器 · 人体红外</div></div>
    </button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
    <sc-for list="{{rest}}" as="r" hint-placeholder-count="4">
      <button type="button" style="display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid #E6E6E6; background: #FFFFFF; border-radius: 14px; padding: 12px 14px; font: inherit">
        <span style="flex: none; width: 48px; height: 48px; border-radius: 10px; background: #F2F4F7; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6F6F6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2 2"></path></svg>
        </span>
        <span><b style="font-size: 14px; display: block">{{r.t}}</b><span style="font-size: 12px; color: #6F6F6F">{{r.p}}</span></span>
      </button>
    </sc-for>
  </div>
  <div style="font-size: 13px; color: #6F6F6F; line-height: 1.7">插图：每个项目一张线稿（stroke 2，round，单色），颜色按项目区分但亮度相近；第二排是同一组插图的 48px 小号，次要项目也能认出。</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { rest: [{ t: '点灯入门', p: 'LED · 按键 · 电位器' }, { t: '语音助手', p: '麦克风 · 功放' }, { t: '摄像头', p: 'OV2640' }, { t: '蓝牙音箱', p: '功放 · 经典蓝牙' }] };
  }
}
</script>
</body>
</html>
