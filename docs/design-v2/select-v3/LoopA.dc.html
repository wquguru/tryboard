<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>闭环 A · 选板结果直通实验台</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #FFFFFF; color: #1E1E1E; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="height: 52px; border-bottom: 1px solid #F0F0F0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px">
    <span style="display: flex; align-items: center; gap: 10px"><span style="color: #6F6F6F">选板</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3B3B3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><span style="color: #6F6F6F">采购 ✓</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3B3B3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><b>实验台</b><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3B3B3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><span style="color: #B3B3B3">组装</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3B3B3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><span style="color: #B3B3B3">成品</span><span style="color: #6F6F6F; margin-left: 8px">· 温湿度计（XIAO ESP32C3）</span></span>
    <span style="color: #0A6FBD">回到采购清单</span>
  </div>
  <div style="flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 360px">
    <div style="background: #F2F4F7; position: relative; display: flex; align-items: center; justify-content: center">
      <svg width="640" height="420" viewBox="0 0 640 420" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="40" y="60" width="560" height="300" rx="10" fill="#FFFFFF" stroke="#D9D9D9"></rect>
        <rect x="260" y="140" width="110" height="140" rx="8" fill="#1E1E1E"></rect>
        <text x="315" y="215" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="JetBrains Mono, monospace">XIAO C3</text>
        <rect x="90" y="120" width="90" height="70" rx="6" fill="#7A4BC9"></rect>
        <text x="135" y="160" text-anchor="middle" font-size="11" fill="#FFFFFF">BME280</text>
        <rect x="450" y="110" width="110" height="80" rx="6" fill="#0E1A2B"></rect>
        <rect x="462" y="122" width="86" height="44" fill="#173A5E"></rect>
        <text x="505" y="182" text-anchor="middle" font-size="10" fill="#FFFFFF">OLED</text>
        <path d="M180 140c40 0 50 20 80 20" stroke="#0D99FF" stroke-width="3"></path>
        <path d="M180 170c40 0 50 20 80 20" stroke="#E8A317" stroke-width="3"></path>
        <path d="M370 160c40 0 50-20 80-20" stroke="#0D99FF" stroke-width="3"></path>
        <path d="M370 190c40 0 50-20 80-20" stroke="#E8A317" stroke-width="3"></path>
      </svg>
      <div style="position: absolute; left: 24px; top: 20px; background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 10px; padding: 10px 14px; font-size: 13px; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #14AE5C"></span>按采购清单里的零件和选板引脚表，摆好、连好了 3 个</div>
    </div>
    <div style="border-left: 1px solid #F0F0F0; padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <b style="font-size: 18px">下一步：放进固件</b>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <button type="button" style="height: 48px; border: 2px dashed #0D99FF; border-radius: 10px; background: #F5FAFF; font: inherit; color: #0A6FBD">拖入你的 flash.bin</button>
        <button type="button" style="height: 48px; border: 1px solid #E6E6E6; border-radius: 10px; background: #FFFFFF; font: inherit">复制给 AI 的任务书</button>
        <button type="button" style="height: 48px; border: 1px solid #E6E6E6; border-radius: 10px; background: #FFFFFF; font: inherit">先跑演示固件看看</button>
      </div>
      <div style="border-top: 1px solid #F0F0F0; padding-top: 14px; display: flex; flex-direction: column; gap: 4px; font-size: 13px">
        <b style="font-size: 14px; margin-bottom: 4px">检查点 · 按你的零件自动生成</b>
        <sc-for list="{{cps}}" as="c" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #F7F7F7">
            <sc-if value="{{c.full}}" hint-placeholder-value="true"><svg width="12" height="12" viewBox="0 0 16 16" aria-label="仿真验证" style="flex: none"><circle cx="8" cy="8" r="6.2" fill="#1E1E1E"></circle></svg></sc-if>
            <sc-if value="{{c.beh}}" hint-placeholder-value="false"><svg width="12" height="12" viewBox="0 0 16 16" aria-label="行为模拟" style="flex: none"><circle cx="8" cy="8" r="6.2" fill="none" stroke="#1E1E1E" stroke-width="1.6"></circle><path d="M8 8V1.8A6.2 6.2 0 1 1 1.8 8Z" fill="#1E1E1E"></path></svg></sc-if>
            <span style="flex: 1">{{c.t}}</span><span style="font-size: 12px; color: #B3B3B3">待运行</span>
          </div>
        </sc-for>
        <span style="font-size: 12px; color: #6F6F6F; margin-top: 4px">拖入固件即逐条判；结果写「实际 x；要 y」</span>
      </div>
      <div style="margin-top: auto; font-size: 12px; color: #6F6F6F; line-height: 1.6">作品有 levels.json 里写好的检查点，选板出来的自定义项目没有；按零件生成，就不用为每种组合手写。圆 = 可信度，见设计 B。</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const cps = [
      { t: 'I2C 0x76 有回应（BME280）', c: 'full' },
      { t: 'I2C 0x3c 收到帧（OLED）', c: 'full' },
      { t: '串口打印读数', c: 'full' },
      { t: '深睡后能再唤醒', c: 'beh' }
    ];
    return { cps: cps.map(x => ({ ...x, full: x.c === 'full', beh: x.c === 'beh' })) };
  }
}
</script>
</body>
</html>
