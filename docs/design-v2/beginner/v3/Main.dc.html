<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第 3 课完成 · 进入第 4 课</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D99FF}a:hover{color:#0A6FBD}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1E1E1E; font-family: 'Noto Sans SC', system-ui, sans-serif; font-size: 13px">

  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 16px; background: #FFFFFF; border-bottom: 1px solid #E6E6E6">
    <b style="font-size: 16px; letter-spacing: 0.2px">TryBoard</b>
    <span style="width: 1px; height: 22px; background: #E6E6E6"></span>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="color: #6F6F6F">基础课</span>
      <span style="color: #6F6F6F">/</span>
      <b>第 3 / 12 课 · 让屏幕说话</b>
    </div>
    <div style="display: flex; gap: 3px; margin-left: 8px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="12">
        <span style="{{d.style}}"></span>
      </sc-for>
    </div>
    <div style="flex: 1"></div>
    <button style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #E6E6E6; background: #FFFFFF; color: #3C3C3C; font-size: 13px; cursor: pointer">‹ 第 2 课</button>
    <button style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #0D99FF; background: #E5F4FF; color: #0A6FBD; font-size: 13px; font-weight: 500; cursor: pointer">第 4 课 ›</button>
    <button style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #E6E6E6; background: #FFFFFF; color: #3C3C3C; font-size: 13px; cursor: pointer">≡ 课程目录</button>
  </header>

  <div style="flex: 1; min-height: 0; display: flex">
    <aside style="width: 260px; flex-shrink: 0; box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; border-right: 1px solid #E6E6E6">
      <span style="font-size: 12px; color: #6F6F6F; margin-bottom: 6px">第 3 课的 5 步</span>
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; background: #F7F7F7">
          <span style="width: 20px; height: 20px; border-radius: 10px; background: #14AE5C; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.5 9.5 3.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
          <span style="color: #3C3C3C">{{s}}</span>
        </div>
      </sc-for>
    </aside>

    <main style="flex: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 90% at 50% 40%, #FFFFFF, #ECEFF3)">
      <div style="width: 560px; height: 320px; border-radius: 12px; border: 1px dashed #D9D9D9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #6F6F6F">
        <b style="font-size: 16px; color: #3C3C3C">3D 台面</b>
        <span>开发板 + 面包板 + LED + OLED（第 3 课的零件）</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0E7A41">OLED: Hello, TryBoard</span>
      </div>
    </main>

    <aside style="width: 420px; flex-shrink: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 18px; background: #FFFFFF; border-left: 1px solid #E6E6E6">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #E8F7EE; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5 8.5 14 15.5 6" fill="none" stroke="#0E7A41" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <b style="font-size: 20px">第 3 课完成</b>
          <span style="color: #6F6F6F; font-size: 13px">检查点 03 Screen 通过 · 基础课 3 / 12</span>
        </div>
      </div>

      <div style="height: 1px; background: #E6E6E6"></div>

      <span style="font-size: 12px; color: #6F6F6F">下一课</span>
      <div style="display: flex; gap: 14px; padding: 14px; border-radius: 12px; border: 2px solid #0D99FF; box-shadow: 0 2px 10px #0000000F">
        <div style="width: 84px; height: 72px; flex-shrink: 0; border-radius: 10px; background: #E07A1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 16px; letter-spacing: 1px">PWM</div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; color: #6F6F6F">第 4 课</span>
          <b style="font-size: 17px">呼吸灯</b>
          <span style="color: #3C3C3C; font-size: 13px">让 LED 慢慢亮、慢慢暗：PWM 调亮度</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: #FFF8E6; border: 1px solid #F2D9A6">
        <div style="display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 6h10l-2.5-2.5M15 12H5l2.5 2.5" fill="none" stroke="#8A5A12" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <b style="color: #8A5A12">这一课在另一个作品里</b>
        </div>
        <div style="display: grid; grid-template-columns: 72px 1fr; row-gap: 6px; column-gap: 8px; font-size: 13px; color: #3C3C3C">
          <span style="color: #6F6F6F">换到</span><span>[作品名] · 第 1 关</span>
          <span style="color: #6F6F6F">台面</span><span>开发板 + 面包板 + LED（OLED 收起）</span>
          <span style="color: #6F6F6F">固件</span><span>自动换成第 4 课的内置固件</span>
        </div>
        <span style="font-size: 13px; color: #6F6F6F">第 3 课的接线和进度已保存，随时从课程目录回来。</span>
      </div>

      <div style="flex: 1"></div>
      <button style="height: 48px; border-radius: 10px; border: 0; background: #0B76C8; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">开始第 4 课 →</button>
      <button style="height: 44px; border-radius: 10px; border: 1px solid #E6E6E6; background: #FFFFFF; color: #3C3C3C; font-size: 14px; cursor: pointer">留在第 3 课，再看一遍</button>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dots = Array.from({ length: 12 }, (_, i) => ({
      style: 'width: 14px; height: 6px; border-radius: 3px; ' + (i <= 3 ? 'background: #14AE5C' : i === 4 ? 'background: #0D99FF' : 'background: #E6E6E6'),
    }));
    return { dots, steps: ['认识屏幕', '接上四根线', '运行看看', '改一行字', '检查点'] };
  }
}
</script>
</body>
</html>
