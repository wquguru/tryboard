<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第 0 课 · 认识开发板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 960px; height: 620px; box-sizing: border-box; display: flex; background: #FFFFFF; color: #1E1E1E; font-family: 'Noto Sans SC', system-ui, sans-serif; font-size: 13px">
  <main style="flex: 1; position: relative; background: radial-gradient(120% 90% at 50% 40%, #FFFFFF, #ECEFF3)">
    <span style="position: absolute; left: 20px; top: 16px; font-size: 13px; color: #6F6F6F">台面只有一块板子：这一课不接线</span>

    <!-- board -->
    <div style="position: absolute; left: 150px; top: 120px; width: 260px; height: 400px; border-radius: 10px; background: #23272D; box-shadow: 0 10px 30px rgba(0,0,0,0.25)">
      <div style="position: absolute; left: 10px; top: 20px; width: 10px; height: 360px; border-radius: 3px; background: repeating-linear-gradient(#C9A646 0 6px, #23272D 6px 18px)"></div>
      <div style="position: absolute; right: 10px; top: 20px; width: 10px; height: 360px; border-radius: 3px; background: repeating-linear-gradient(#C9A646 0 6px, #23272D 6px 18px)"></div>
      <div style="position: absolute; left: 70px; top: 40px; width: 120px; height: 120px; border-radius: 6px; background: #B9BEC4; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #23272D">ESP32-S3</div>
      <div style="position: absolute; left: 100px; top: 384px; width: 60px; height: 22px; border-radius: 8px; background: #6F6F6F"></div>
      <div style="position: absolute; left: 50px; top: 330px; width: 26px; height: 26px; border-radius: 4px; background: #3C3C3C; border: 2px solid #6F6F6F"></div>
      <div style="position: absolute; left: 184px; top: 330px; width: 26px; height: 26px; border-radius: 4px; background: #3C3C3C; border: 2px solid #6F6F6F"></div>
      <span style="position: absolute; left: 44px; top: 304px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #D9D9D9">BOOT</span>
      <span style="position: absolute; left: 184px; top: 304px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #D9D9D9">RST</span>
    </div>

    <sc-for list="{{marks}}" as="m" hint-placeholder-count="4">
      <div style="{{m.line}}"></div>
      <div style="{{m.card}}">
        <span style="{{m.badge}}">{{m.n}}</span>
        <div style="display: flex; flex-direction: column; gap: 1px">
          <b style="font-size: 13px">{{m.title}}</b>
          <span style="font-size: 12px; color: #6F6F6F">{{m.sub}}</span>
        </div>
      </div>
    </sc-for>
  </main>

  <aside style="width: 340px; flex-shrink: 0; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border-left: 1px solid #E6E6E6">
    <span style="font-size: 12px; color: #6F6F6F">第 0 课 · 第 1 步 / 3</span>
    <b style="font-size: 20px">在板子上找到这四样</b>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{tasks}}" as="t" hint-placeholder-count="4">
        <div style="{{t.row}}">
          <span style="{{t.dot}}">{{t.mark}}</span>
          <span style="flex: 1">{{t.text}}</span>
          <span style="font-size: 12px; color: #0E7A41">{{t.got}}</span>
        </div>
      </sc-for>
    </div>
    <span style="font-size: 12px; color: #6F6F6F">在 3D 台面里点到它，就会自动打勾。</span>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: #F7F7F7">
      <b style="font-size: 13px">这颗芯片</b>
      <div style="display: grid; grid-template-columns: 1fr auto; row-gap: 6px; column-gap: 10px; font-size: 13px">
        <span>双核 Xtensa LX7，最高 240 MHz</span><span style="color: #6F6F6F; font-size: 12px">数据手册</span>
        <span>512 KB SRAM</span><span style="color: #6F6F6F; font-size: 12px">数据手册</span>
        <span>2.4 GHz Wi-Fi + 低功耗蓝牙 5</span><span style="color: #6F6F6F; font-size: 12px">数据手册</span>
      </div>
    </div>
    <div style="flex: 1"></div>
    <button style="height: 48px; border-radius: 10px; border: 1px solid #0D99FF; background: #FFFFFF; color: #0A6FBD; font-size: 15px; font-weight: 500; cursor: pointer">跳过，下一步</button>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const M = [
      [1, 'USB-C 口', '供电 + 下载程序', 280, 515, 440, 540, true],
      [2, 'BOOT 键', '第 2 课会用它', 213, 463, 440, 440, true],
      [3, '主芯片', '你写的代码在这里跑', 340, 220, 440, 200, false],
      [4, '排针', '每根针是一个引脚', 400, 300, 440, 320, false],
    ];
    const marks = M.map(([n, title, sub, px, py, cx, cy, done]) => ({
      n, title, sub,
      line: `position: absolute; left: ${px}px; top: ${py}px; width: ${cx - px}px; height: 0; border-top: 1.5px solid #0D99FF; transform-origin: 0 0; transform: rotate(${Math.atan2(cy + 18 - py, cx - px) * 180 / Math.PI}deg); width: ${Math.hypot(cx - px, cy + 18 - py)}px`,
      card: `position: absolute; left: ${cx}px; top: ${cy}px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: #FFFFFF; border: 1px solid ${done ? '#14AE5C' : '#E6E6E6'}; box-shadow: 0 2px 8px rgba(0,0,0,0.08)`,
      badge: `width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #FFFFFF; background: ${done ? '#14AE5C' : '#0D99FF'}`,
    }));
    const T = [['找到 USB-C 口', true], ['找到 BOOT 键', true], ['找到主芯片', false], ['找到排针上的 GPIO5', false]];
    const tasks = T.map(([text, done]) => ({
      text, got: done ? '已找到' : '',
      mark: done ? '✓' : '',
      row: 'display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 8px; ' + (done ? 'background: #E8F7EE' : 'background: #FFFFFF; border: 1px solid #E6E6E6'),
      dot: 'width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #FFFFFF; ' + (done ? 'background: #14AE5C' : 'border: 1.5px solid #6F6F6F; box-sizing: border-box'),
    }));
    return { marks, tasks };
  }
}
</script>
</body>
</html>
