<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机引导课</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A6FBD}a:hover{color:#08548F}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #fff; color: #1E1E1E; font-family: 'Noto Sans SC', system-ui, sans-serif; font-size: 13px; line-height: 20px">
  <header style="height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #E6E6E6">
    <button aria-label="返回" style="width: 44px; height: 44px; border: 0; background: transparent"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="#1E1E1E" stroke-width="1.8"></path></svg></button>
    <div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700">第 1 关 · 点亮一颗 LED</span><span style="display: flex; gap: 3px; margin-top: 3px"><span style="width: 22px; height: 3px; border-radius: 2px; background: #0B76C8"></span><span style="width: 22px; height: 3px; border-radius: 2px; background: #0B76C8"></span><span style="width: 22px; height: 3px; border-radius: 2px; background: #0B76C8"></span><span style="width: 22px; height: 3px; border-radius: 2px; background: #E6E6E6"></span><span style="width: 22px; height: 3px; border-radius: 2px; background: #E6E6E6"></span></span></div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5E5E5E">3/5</span>
  </header>
  <div style="position: relative; flex: 0 0 300px; background: radial-gradient(120% 90% at 50% 40%, #FFFFFF, #ECEFF3)">
    <svg viewBox="40 120 700 330" style="position: absolute; inset: 0; width: 100%; height: 100%" role="img" aria-label="开发板、电阻和 LED，GPIO5 和 LED 被标出">
      <defs><pattern id="mholes" width="16" height="16" patternUnits="userSpaceOnUse"><rect x="6" y="6" width="4" height="4" rx="1" fill="#A8A397"></rect></pattern>
      <radialGradient id="mglow"><stop offset="0" stop-color="#FF4D4F" stop-opacity=".9"></stop><stop offset="1" stop-color="#FF4D4F" stop-opacity="0"></stop></radialGradient></defs>
      <rect x="60" y="200" width="640" height="220" rx="10" fill="#F4F2EC" stroke="#D8D4CA"></rect>
      <rect x="72" y="214" width="616" height="84" fill="url(#mholes)"></rect><rect x="72" y="320" width="616" height="84" fill="url(#mholes)"></rect>
      <rect x="60" y="302" width="640" height="14" fill="#E4E0D5"></rect>
      <rect x="86" y="235" width="304" height="150" rx="6" fill="#1F2328"></rect>
      <rect x="114" y="258" width="124" height="104" rx="3" fill="#C9CDD2"></rect>
      <circle cx="248" cy="243" r="5" fill="#FFB020"></circle>
      <line x1="440" y1="263" x2="544" y2="263" stroke="#8A8F96" stroke-width="2"></line>
      <rect x="470" y="256" width="44" height="14" rx="7" fill="#E8D3A8"></rect>
      <circle cx="601" cy="244" r="44" fill="url(#mglow)"></circle>
      <path d="M587 258 v-14 a14 14 0 0 1 28 0 v14 z" fill="#FF4D4F"></path>
      <line x1="594" y1="258" x2="594" y2="292" stroke="#8A8F96" stroke-width="2"></line><line x1="608" y1="258" x2="608" y2="286" stroke="#8A8F96" stroke-width="2"></line>
      <path d="M248 243 C 262 165, 420 165, 440 263" fill="none" stroke="#F08C2E" stroke-width="6" stroke-linecap="round"></path>
      <path d="M544 263 L 594 263 L 594 292" fill="none" stroke="#F08C2E" stroke-width="5"></path>
      <path d="M608 286 C 650 450, 180 450, 136 377" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"></path>
      <path d="M248 243 C 262 165, 420 165, 440 263 L 544 263 L 594 263 L 594 292 M608 286 C 650 450, 180 450, 136 377" fill="none" stroke="#0D99FF" stroke-width="3" stroke-dasharray="8 6"></path>
    </svg>
    <div style="position: absolute; left: 12px; top: 12px; padding: 6px 10px; background: rgba(255,255,255,.96); border: 1px solid #CFE6FA; border-radius: 10px; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 12px">GPIO5</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #0A6FBD">现在：高 3.3 V</span></div>
    <div style="position: absolute; right: 12px; top: 12px; padding: 6px 10px; background: rgba(255,255,255,.96); border: 1px solid #CFE6FA; border-radius: 10px; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 12px">LED</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #0A6FBD">现在：亮</span></div>
    <div style="position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; gap: 8px; justify-content: center">
      <button style="height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #1E1E1E; color: #fff; font-weight: 500">■ 停止</button>
      <button aria-pressed="true" style="height: 44px; padding: 0 14px; border: 1px solid #0D99FF; border-radius: 8px; background: #E5F4FF; color: #0A6FBD">看电流</button>
      <button style="height: 44px; padding: 0 14px; border: 1px solid #E6E6E6; border-radius: 8px; background: #fff; color: #1E1E1E">原理图</button>
    </div>
  </div>
  <section style="flex: 1 1 auto; min-height: 0; border-radius: 16px 16px 0 0; margin-top: -8px; background: #fff; box-shadow: 0 -4px 16px #0000000F; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 10px; position: relative">
    <span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #D9D9D9"></span>
    <span style="font-size: 11px; font-weight: 500; color: #5E5E5E">第 4 步 · 运行代码</span>
    <p style="margin: 0; font-size: 14px; line-height: 22px">代码每 0.5 秒把 GPIO5 在高、低之间切换一次，LED 跟着一亮一灭。下面高亮的就是正在执行的那一行。</p>
    <div style="border: 1px solid #E6E6E6; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 20px; padding: 4px 0">
      <div style="display: flex; gap: 8px; padding-right: 8px"><span style="width: 22px; text-align: right; color: #8C8C8C">7</span><span style="white-space: pre">    on = !on;</span></div>
      <div style="display: flex; gap: 8px; padding-right: 8px; background: #E5F4FF; box-shadow: inset 3px 0 0 #0D99FF"><span style="width: 22px; text-align: right; color: #8C8C8C">8</span><span style="white-space: pre">    gpio_set_level(LED, on);</span></div>
      <div style="display: flex; gap: 8px; padding-right: 8px; align-items: center"><span style="width: 22px; text-align: right; color: #8C8C8C">10</span><span style="white-space: pre">    vTaskDelay(ms(</span><span style="padding: 0 6px; border-radius: 4px; background: #0B76C8; color: #fff">500</span><span>));</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; font-size: 12px">
      <div style="display: flex; gap: 10px"><span style="font-family: 'JetBrains Mono', monospace; color: #5E5E5E">1.50 s</span><span>LED 灭 · GPIO5 → 低 0 V</span></div>
      <div style="display: flex; gap: 10px"><span style="font-family: 'JetBrains Mono', monospace; color: #5E5E5E">1.00 s</span><span>LED 亮 · GPIO5 → 高 3.3 V</span></div>
    </div>
    <div style="margin-top: auto; display: flex; gap: 8px">
      <button style="flex: 1; height: 48px; border: 1px solid #E6E6E6; border-radius: 10px; background: #fff; color: #1E1E1E; font-size: 15px">上一步</button>
      <button style="flex: 2; height: 48px; border: 0; border-radius: 10px; background: #0B76C8; color: #fff; font-size: 15px; font-weight: 500">下一步：改一改</button>
    </div>
  </section>
</div>
</x-dc>
