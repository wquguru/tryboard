<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>课程地图</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5FD1}a:hover{color:#174BA6}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 560px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 22px; background: #F6F3EE; color: #1E2227; font-family: 'Noto Sans SC', system-ui, sans-serif; font-size: 14px">
  <div style="display: flex; align-items: center; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <b style="font-size: 22px">基础课</b>
      <span style="color: #5E646C">从一块板子到一台桌面气象站，每课只多一样零件</span>
    </div>
    <div style="flex: 1"></div>
    <div style="width: 320px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px"><span>已完成 {{doneCount}} / {{total}} 课</span><span style="color: #5E646C">完成标准：本课检查点通过</span></div>
      <div style="height: 8px; border-radius: 4px; background: #E4DED3"><div style="{{barStyle}}"></div></div>
    </div>
    <div style="display: flex; gap: 14px; font-size: 12px; color: #3B4148">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #FFFFFF; border: 1px solid #CFC8BA"></span>已写好</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; border: 1px dashed #A89F8E; box-sizing: border-box"></span>计划中</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px">
    <sc-for list="{{lessons}}" as="l" hint-placeholder-count="12">
      <button style="{{l.card}}">
        <div style="{{l.thumb}}">{{l.tag}}</div>
        <div style="display: flex; flex-direction: column; gap: 3px; text-align: left">
          <span style="font-size: 12px; color: #5E646C">第 {{l.n}} 课</span>
          <b style="font-size: 15px; color: #1E2227">{{l.title}}</b>
          <span style="font-size: 12px; color: #5E646C">{{l.part}}</span>
        </div>
        <span style="{{l.badgeStyle}}">{{l.badge}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const L = [
      ['认识开发板', 'ESP32-S3 本身', 'S3', '#23272D', 'done'],
      ['点亮一颗 LED', 'LED + 220 Ω', 'LED', '#E5484D', 'current'],
      ['按一下按钮', 'BOOT 键', 'BTN', '#3B4148', 'ready'],
      ['让屏幕说话', 'SSD1306 OLED', 'OLED', '#1F5FD1', 'ready'],
      ['呼吸灯', 'PWM 调亮度', 'PWM', '#E07A1F', 'plan'],
      ['彩色灯带', 'WS2812', 'RGB', '#8E4EC6', 'plan'],
      ['发出声音', '无源蜂鸣器', 'BUZ', '#5E646C', 'plan'],
      ['转动舵机', 'SG90 舵机', 'SERVO', '#2B6CB0', 'plan'],
      ['读温湿度', 'BME280', 'BME', '#17805A', 'plan'],
      ['拧旋钮', '电位器 · ADC', 'ADC', '#B5651B', 'plan'],
      ['做个 USB 键盘', 'USB HID', 'USB', '#1E2227', 'plan'],
      ['综合：桌面气象站', '前面学过的全部', 'ALL', '#146B4B', 'plan'],
    ];
    const BADGE = {
      done: ['已完成', 'background: #EAF5EF; color: #146B4B'],
      current: ['进行中 · 2/5', 'background: #EDF3FD; color: #1F4FA8'],
      ready: ['可以开始', 'background: #F6F3EE; color: #3B4148'],
      plan: ['计划中', 'background: transparent; color: #5E646C; border: 1px dashed #A89F8E'],
    };
    const lessons = L.map(([title, part, tag, color, st], i) => ({
      n: i, title, part, tag,
      badge: BADGE[st][0],
      badgeStyle: 'align-self: flex-start; padding: 3px 8px; border-radius: 6px; font-size: 12px; box-sizing: border-box; ' + BADGE[st][1],
      card: 'display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; cursor: pointer; font-family: inherit; ' +
        (st === 'plan' ? 'background: transparent; border: 1px dashed #A89F8E' : st === 'current' ? 'background: #FFFFFF; border: 2px solid #1F5FD1; box-shadow: 0 4px 14px rgba(31,95,209,0.14)' : 'background: #FFFFFF; border: 1px solid #E4DED3'),
      thumb: `height: 72px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 16px; letter-spacing: 1px; color: #FFFFFF; background: ${color}; opacity: ${st === 'plan' ? 0.55 : 1}`,
    }));
    const doneCount = 1;
    return { lessons, doneCount, total: L.length, barStyle: `width: ${Math.round(doneCount / L.length * 100)}%; height: 8px; border-radius: 4px; background: #17805A` };
  }
}
</script>
</body>
</html>
