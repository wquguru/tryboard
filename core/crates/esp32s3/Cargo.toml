[package]
name = "tryboard-esp32s3"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tryboard-xtensa = { path = "../xtensa" }
tryboard-rv32 = { path = "../rv32" }
# Peripherals shared with C3 with identical register layout (UART, SYSTIMER, TIMG, SPI flash, LEDC) are reused as-is
tryboard-esp32c3 = { path = "../esp32c3" }
# Wi-Fi MAC model (shared with C3)
tryboard-soc = { path = "../soc" }
