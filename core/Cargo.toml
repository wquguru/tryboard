[workspace]
resolver = "2"
members = ["crates/rv32", "crates/xtensa","crates/soc", "crates/esp32c3", "crates/esp32s3", "crates/esp32", "crates/elec", "crates/machine", "crates/cli", "crates/wasm"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "LicenseRef-Proprietary"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
opt-level = 1
